services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: utask-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - utask-network

  backend:
    build:
      context: ./backend
      target: development
    container_name: utask-backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB}
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - utask-network

  postgres:
    image: postgres:16-alpine
    container_name: utask-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - utask-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: utask-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - utask-network

  node:
    image: node:22-alpine
    container_name: utask-node
    working_dir: /app
    user: node
    volumes:
      - ./:/app
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
    entrypoint: [ "sh" ]
    stdin_open: true
    tty: true
    networks:
      - utask-network

volumes:
  frontend_node_modules:
  backend_node_modules:
  postgres_data:
  pgadmin_data:

networks:
  utask-network:
    driver: bridge
